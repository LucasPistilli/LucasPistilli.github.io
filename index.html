<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lucas Neres Pistilli — Desenvolvedor Full-Stack</title>
  <meta name="description" content="Portfólio de Lucas Neres Pistilli, desenvolvedor full-stack: TypeScript, Node.js, Python, PostgreSQL.">
  <meta name="theme-color" content="#030304">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23030304'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23ff7a1a' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23000'/%3E%3C/svg%3E">
  <link rel="preload" as="image" href="assets/hero-frames/f001.webp">
  <link rel="stylesheet" href="css/v2.css">
  <script defer src="js/v2.js"></script>
</head>
<body class="is-loading">
  <a class="skip" href="#processo">Pular para o conteúdo</a>

  <!-- carregamento -->
  <div class="loader" id="loader" aria-hidden="true">
    <div class="loader__bh"><i></i><b></b></div>
    <p class="loader__pct mono"><span id="loader-pct">0</span>%</p>
    <p class="loader__msg mono" id="loader-msg"></p>
  </div>

  <!-- buraco negro viajante (substitui o celular 3D da referência) -->
  <canvas id="bh" class="bh" aria-hidden="true"></canvas>
  <div class="bh-screen" id="bh-screen" aria-hidden="true"><div class="bh-screen__in" id="bh-screen-in"></div></div>

  <header class="nav" id="nav">
    <a class="nav__brand" href="#topo"><i aria-hidden="true"></i><span data-c="shortName"></span></a>
    <nav aria-label="Principal"><ul class="nav__links" id="nav-links"></ul></nav>
    <a class="pill pill--amber nav__cta" href="#contato" data-s="navCta"></a>
    <button class="nav__burger" id="burger" type="button" aria-label="Abrir menu" aria-expanded="false"><i></i><i></i></button>
  </header>
  <div class="navsheet" id="navsheet" hidden><ol id="navsheet-links"></ol></div>

  <main>
    <!-- 01 HERO -->
    <section class="sheet sheet--void hero" id="topo" aria-labelledby="hero-title">
      <div class="hero__glow" aria-hidden="true"></div>
      <div class="wrap hero__grid">
        <div class="hero__copy">
          <p class="eyebrow" data-s="hero.eyebrow"></p>
          <h1 class="hero__title" id="hero-title"></h1>
          <p class="hero__lead" data-c="heroText"></p>
          <div class="hero__btns">
            <a class="btn btn--amber" href="#projetos"><span data-s="hero.primary"></span><b aria-hidden="true">→</b></a>
            <a class="btn btn--line" href="#processo"><span data-s="hero.secondary"></span><b aria-hidden="true">↓</b></a>
          </div>
          <ul class="hero__meta mono" id="hero-meta"></ul>
        </div>
        <div class="hero__slot" data-bh-anchor="hero">
          <div class="floaters" id="floaters" aria-hidden="true">
            <span class="fl" style="--i:0;--x:6%;--y:8%;--s:92px;--r:-14deg" data-depth="0.7"></span>
            <span class="fl" style="--i:1;--x:84%;--y:4%;--s:104px;--r:8deg" data-depth="1.2"></span>
            <span class="fl" style="--i:2;--x:2%;--y:76%;--s:84px;--r:10deg" data-depth="0.9"></span>
            <span class="fl" style="--i:3;--x:88%;--y:74%;--s:74px;--r:-12deg" data-depth="1.4"></span>
            <span class="fl" style="--i:4;--x:58%;--y:92%;--s:66px;--r:-26deg" data-depth="0.6"></span>
            <span class="fl" style="--i:5;--x:97%;--y:38%;--s:80px;--r:18deg" data-depth="1.1"></span>
          </div>
          <div class="chip-card chip-card--a" id="chip-a"></div>
          <div class="chip-card chip-card--b" id="chip-b"></div>
          <p class="hero__hint mono"><svg viewBox="0 0 70 54" aria-hidden="true"><path d="M66 50C52 52 22 44 10 8M10 8l-4 14M10 8l12 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span data-s="hero.hint"></span></p>
        </div>
      </div>
      <div class="marquee" aria-hidden="true"><div class="marquee__track" id="marquee"></div></div>
    </section>

    <!-- 02 PROCESSO (o buraco negro pousa, gira e troca de tela) -->
    <section class="sheet sheet--ember how" id="processo" aria-labelledby="how-title">
      <div class="how__pin">
        <div class="wrap how__grid">
          <div class="how__stage">
            <div class="how__plate" aria-hidden="true">
              <svg viewBox="0 0 400 400" class="how__ring"><defs><path id="ringpath" d="M200,200 m-178,0 a178,178 0 1,1 356,0 a178,178 0 1,1 -356,0"/></defs>
                <text class="mono"><textPath href="#ringpath" id="ring-text"></textPath></text></svg>
            </div>
            <div class="how__slot" data-bh-anchor="how"></div>
          </div>
          <div class="how__copy">
            <div class="how__meta"><span class="eyebrow" data-s="process.eyebrow"></span><span class="how__count"><b id="how-n">1</b>/<i id="how-t">4</i></span></div>
            <h2 class="h2 how__title" id="how-title"></h2>
            <p class="lead how__text" id="how-text"></p>
            <p class="pill pill--dark mono how__pill" id="how-pill"></p>
            <ol class="how__bars mono" id="how-bars"></ol>
          </div>
        </div>
      </div>
    </section>

    <!-- 03 STACK (bento) -->
    <section class="sheet sheet--void bento" id="stack" aria-labelledby="bento-title">
      <div class="wrap">
        <header class="head reveal">
          <p class="eyebrow" data-s="bento.eyebrow"></p>
          <h2 class="h2" id="bento-title"></h2>
          <p class="lead" data-s="bento.lead"></p>
        </header>
        <div class="bn-grid" id="bn-grid"></div>
      </div>
    </section>

    <!-- 04 SOBRE (linha do tempo) -->
    <section class="sheet sheet--cream about" id="sobre" aria-labelledby="about-title">
      <div class="wrap">
        <header class="head head--split reveal">
          <div><p class="eyebrow" data-s="about.eyebrow"></p><h2 class="h2" id="about-title"></h2></div>
          <p class="lead" data-c="about.text"></p>
        </header>
        <ol class="chapters" id="chapters"></ol>
        <p class="chapters__count mono" id="chapters-count"></p>
        <p class="note mono" data-s="about.note"></p>
      </div>
    </section>

    <!-- 05 PERGUNTE AO LUCAS -->
    <section class="sheet sheet--char chat" id="pergunte" aria-labelledby="chat-title">
      <div class="wrap chat__grid">
        <div class="chat__copy reveal">
          <p class="eyebrow" data-s="chat.eyebrow"></p>
          <h2 class="h2" id="chat-title"></h2>
          <p class="lead" data-s="chat.lead"></p>
          <p class="mono chat__label" data-s="chat.label"></p>
          <div class="chat__qs" id="chat-qs"></div>
        </div>
        <div class="chat__win reveal" aria-live="polite">
          <div class="chat__log" id="chat-log"></div>
        </div>
      </div>
    </section>

    <!-- 06 PROJETOS (o buraco negro mostra a capa) -->
    <section class="sheet sheet--gold projects" id="projetos" aria-labelledby="projects-title">
      <div class="wrap">
        <header class="head head--split reveal">
          <div><p class="eyebrow" data-s="projects.eyebrow"></p><h2 class="h2" id="projects-title"></h2></div>
          <p class="lead" data-s="projects.lead"></p>
        </header>
        <div class="pj">
          <div class="pj__list" id="pj-list" role="tablist" aria-label="Projetos"></div>
          <div class="pj__slot"><div class="pj__anchor" data-bh-anchor="projects"></div></div>
          <article class="pj__card" id="pj-card" aria-live="polite"></article>
        </div>
      </div>
    </section>

    <!-- 07 FLUXO DE UMA REQUISIÇÃO -->
    <section class="sheet sheet--void flow" id="fluxo" aria-labelledby="flow-title">
      <div class="wrap">
        <header class="head head--split reveal">
          <div><p class="eyebrow" data-s="flow.eyebrow"></p><h2 class="h2" id="flow-title"></h2></div>
          <div><p class="lead" data-s="flow.lead"></p><div class="toggle" id="flow-tabs" role="tablist"></div></div>
        </header>
        <div class="flow__stage" id="flow-stage">
          <canvas class="flow__canvas" id="flow-canvas" aria-hidden="true"></canvas>
          <div class="flow__src" id="flow-src"></div>
          <ul class="flow__nodes" id="flow-nodes"></ul>
        </div>
        <p class="flow__foot mono" id="flow-foot"></p>
      </div>
    </section>

    <!-- 08 CEMITÉRIO DE BUGS -->
    <section class="sheet sheet--amber bugs" id="bugs" aria-labelledby="bugs-title">
      <div class="wrap">
        <header class="head head--split">
          <div><p class="eyebrow" data-s="bugs.eyebrow"></p><h2 class="h2" id="bugs-title"></h2><p class="lead" data-s="bugs.lead"></p></div>
          <div class="bugs__score">
            <p class="mono" data-s="bugs.counter"></p>
            <p class="bugs__num"><b id="bugs-n">0</b><span class="mono" data-s="bugs.of"></span></p>
            <button class="btn btn--dark" id="bugs-all" type="button"><span data-s="bugs.all"></span></button>
          </div>
        </header>
      </div>
      <div class="yard" id="yard"></div>
      <div class="grass" aria-hidden="true"></div>
    </section>

    <!-- 09 ÓRBITA DE TECNOLOGIAS -->
    <section class="sheet sheet--ember orbit" id="orbita" aria-labelledby="orbit-title">
      <div class="wrap">
        <header class="head head--center reveal">
          <p class="eyebrow" data-s="orbit.eyebrow"></p>
          <h2 class="h2" id="orbit-title"></h2>
          <p class="lead" data-s="orbit.lead"></p>
        </header>
        <div class="orb" id="orb">
          <div class="orb__rings" aria-hidden="true"><i></i><i></i></div>
          <img class="orb__core" src="assets/img/bh-core.webp" alt="" loading="lazy">
          <ul class="orb__items" id="orb-items"></ul>
          <p class="orb__drag mono" data-s="orbit.drag"></p>
        </div>
        <ul class="orb__stats" id="orb-stats"></ul>
      </div>
    </section>

    <!-- 10 CONTATO -->
    <section class="sheet sheet--void cta" id="contato" aria-labelledby="cta-title">
      <div class="cta__rays" aria-hidden="true"></div>
      <div class="wrap cta__grid">
        <div class="cta__copy">
          <div class="cta__badge" aria-hidden="true"><svg viewBox="0 0 200 200"><defs><path id="badgepath" d="M100,100 m-78,0 a78,78 0 1,1 156,0 a78,78 0 1,1 -156,0"/></defs><text class="mono"><textPath href="#badgepath" id="badge-text"></textPath></text></svg><img src="assets/img/bh-core.webp" alt=""></div>
          <p class="eyebrow" data-s="contact.eyebrow"></p>
          <h2 class="h2 cta__title" id="cta-title"></h2>
          <p class="lead" data-c="contactSection.text"></p>
          <div class="cta__btns" id="cta-btns"></div>
          <ul class="cta__checks mono" id="cta-checks"></ul>
        </div>
        <div class="cta__slot" data-bh-anchor="cta"></div>
      </div>
    </section>
  </main>

  <footer class="footer" id="footer">
    <div class="wrap footer__grid">
      <p class="footer__tag" id="footer-tag"></p>
      <div class="footer__cols" id="footer-cols"></div>
    </div>
    <div class="wrap footer__legal mono"><p data-s="footer.legal"></p><p data-s="footer.credit"></p></div>
    <p class="footer__word" aria-hidden="true"><span>LUCAS</span><img src="assets/img/bh-core.webp" alt=""><span>PISTILLI</span></p>
  </footer>
</body>
</html>
